name: Deploy React App to GitHub Pages

on:
  # Ручной запуск
  workflow_dispatch:
  
  # Автоматический запуск при пуше в main ветку
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  
  # Запуск при создании pull request в main
  pull_request:
    branches:
      - main

# Права для деплоя на GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Запрещаем одновременный запуск нескольких пайплайнов
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job 1: Линтинг и проверка кода
  lint:
    name: Lint and Check Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run TypeScript check (if you have TypeScript)
        run: |
          if [ -f "tsconfig.json" ]; then
            npm run type-check || echo "TypeScript check failed"
          fi
        continue-on-error: true
  
  # Job 2: Сборка приложения
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint
    if: success() || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 1
  
  # Job 3: Деплой на GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy: ${{ github.event.head_commit.message }}'
